name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: streetkey
          POSTGRES_PASSWORD: streetkey
          POSTGRES_DB: streetkey_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U streetkey" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://streetkey:streetkey@localhost:5432/streetkey_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run server:typecheck
      - run: npm test
      - run: npm run server:test
      - run: npm run build:all
